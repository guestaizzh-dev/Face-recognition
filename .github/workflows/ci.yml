name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python checks
        run: |
          PYTHONPYCACHEPREFIX=/tmp/face-verify-demo-pycache python -m py_compile backend/app/*.py tests/test_verification_guards.py
          PYTHONPYCACHEPREFIX=/tmp/face-verify-demo-pycache python -m pytest -q

      - name: Run frontend static checks
        run: |
          node --check backend/static/app.js
          node scripts/test_frontend_static.js

  package-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/zhengshi'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out exact release
        uses: actions/checkout@v4

      - name: Build commit-addressed release archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output="dist/face-verify-${GITHUB_SHA}.tar.gz" HEAD
          sha256sum "dist/face-verify-${GITHUB_SHA}.tar.gz" > "dist/face-verify-${GITHUB_SHA}.sha256"
          printf '{"release_sha":"%s","repository":"%s","workflow_run_id":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "dist/release.json"

      - name: Attest release archive
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/face-verify-${{ github.sha }}.tar.gz

      - name: Upload release archive and checksums
        uses: actions/upload-artifact@v4
        with:
          name: face-verify-${{ github.sha }}
          path: dist/
          if-no-files-found: error
